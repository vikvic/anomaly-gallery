<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anomaly Gallery</title>
<style>
  :root{
    --wall:#17130f; --wall2:#0a0807; --frame:#6b5836; --frame2:#3a2f1d;
    --ink:#ddd2c0; --dim:#8d8170; --red:#b8352c; --green:#7fa368; --amber:#c98a3f;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);
       background:radial-gradient(130% 95% at 50% 4%,var(--wall),var(--wall2));
       font:15px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
       padding:18px 16px 60px}
  .wrap{max-width:1240px;margin:0 auto}
  header{text-align:center;margin-bottom:14px}
  h1{font-size:23px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;margin:0 0 3px}
  .tag{color:var(--dim);font-style:italic;font-size:13px;margin:0}

  /* ---- HUD ---- */
  .hud{position:sticky;top:0;z-index:20;margin:0 0 16px;padding:10px 14px;
       background:rgba(12,10,8,.93);border:1px solid #2c251d;border-radius:3px;
       backdrop-filter:blur(6px);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .clock{font:22px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;min-width:74px}
  .clock.warn{color:var(--amber)} .clock.crit{color:var(--red)}
  .found{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
  .found b{color:var(--green);font-weight:400}
  .barwrap{flex:1 1 180px;height:5px;background:#2a231b;border-radius:3px;overflow:hidden;min-width:120px}
  .bar{height:100%;width:100%;background:linear-gradient(90deg,var(--green),var(--amber));
       transition:width .1s linear}
  .bar.crit{background:var(--red)}
  button{background:#241d16;color:var(--ink);border:1px solid #4a3d2c;padding:8px 15px;
       font:inherit;font-size:13px;cursor:pointer;border-radius:2px}
  button:hover:not(:disabled){background:#33281d}
  button:disabled{opacity:.4;cursor:default}
  .say{color:var(--dim);font-style:italic;font-size:13px;flex:1 1 100%;min-height:19px}
  .say.good{color:var(--green);font-style:normal}
  .say.bad{color:var(--red);font-style:normal}

  /* ---- gallery ---- */
  .gal{display:flex;justify-content:center;position:relative}
  .gal .plate{width:100%;max-width:660px;transition:filter .25s}
  /* Pause must HIDE the painting. Otherwise pausing is just an unlimited timer:
     you would study the canvas at leisure and unpause to click. */
  .gal.paused .plate{filter:blur(22px) saturate(.25) brightness(.3)}
  .gal.paused::after{content:"Paused";position:absolute;inset:0;display:grid;
     place-items:center;pointer-events:none;
     font:14px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.28em;
     text-transform:uppercase;color:#8d8170}
  .nav{display:flex;gap:12px;align-items:center;margin-left:auto}
  .nav a{color:var(--dim);font-size:12px;letter-spacing:.06em;text-decoration:none;
     border-bottom:1px solid #362d22;padding-bottom:2px}
  .nav a:hover{color:var(--ink);border-color:#6b5836}
  .pos{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);
       letter-spacing:.06em;min-width:52px}
  .rrows{text-align:left;margin:14px 0 18px;border-top:1px solid #2c251d}
  .rrow{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;
        border-bottom:1px solid #221c16;font-size:12.5px}
  .rrow span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow b{font-weight:400;font-family:ui-monospace,Menlo,Consolas,monospace}
  .rrow b.ok{color:var(--green)} .rrow b.no{color:var(--red)}
  .plate{position:relative}
  /* The frame itself is feathered away rather than ending at a crisp rectangle:
     two linear-gradient masks intersected, so all four edges fade over 44px
     while the middle stays rectangular. A radial mask here would round the
     plate into an oval; this keeps it a painting on a wall, lit from the front,
     with the gilding falling off into the dark at the periphery.
     Note a mask also clips box-shadow, so the drop shadow is gone by design —
     the fade does that job now. */
  .mount{background:linear-gradient(158deg,var(--frame),var(--frame2));padding:11px;border-radius:2px;
       box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),
                  inset 0 0 34px 14px rgba(0,0,0,.7);
       -webkit-mask-image:
         linear-gradient(to right,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%),
         linear-gradient(to bottom,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%);
       -webkit-mask-composite:source-in;
       mask-image:
         linear-gradient(to right,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%),
         linear-gradient(to bottom,transparent 0,#000 44px,#000 calc(100% - 44px),transparent 100%);
       mask-composite:intersect}
  .mat{background:#000;padding:10px;position:relative;overflow:hidden}
  /* The painting dissolves into the dark instead of ending at a crisp rectangle.
     Two layers do it: a mask that fades the canvas edges to nothing against the
     black mat, and a vignette over the top for depth. The inner ~55% is left
     untouched so anomalies stay findable — the darkening only bites near the
     border, where nothing is ever placed. */
  canvas{display:block;width:100%;height:auto;cursor:crosshair;
     -webkit-mask-image:radial-gradient(ellipse 98% 96% at 50% 46%,
        #000 40%, rgba(0,0,0,.82) 68%, rgba(0,0,0,.28) 88%, rgba(0,0,0,0) 100%);
     mask-image:radial-gradient(ellipse 98% 96% at 50% 46%,
        #000 40%, rgba(0,0,0,.82) 68%, rgba(0,0,0,.28) 88%, rgba(0,0,0,0) 100%)}
  .mat::after{content:"";position:absolute;inset:0;pointer-events:none;
     background:radial-gradient(ellipse 94% 90% at 50% 44%,
       rgba(0,0,0,0) 38%, rgba(0,0,0,.34) 62%, rgba(0,0,0,.80) 84%, rgba(0,0,0,1) 100%)}
  .cap{margin-top:8px;font-size:11px;color:#b3a184;letter-spacing:.05em;line-height:1.35}
  .cap b{display:block;font-weight:400;color:#d6c6a4}
  .cap i{color:#87775e}
  .lock canvas{cursor:default}

  /* ---- overlays ---- */
  .veil{position:fixed;inset:0;z-index:40;display:none;place-items:center;
        background:rgba(6,5,4,.88);backdrop-filter:blur(3px);padding:20px}
  .veil.on{display:grid}
  .card{max-width:440px;text-align:center;border:1px solid #372d22;border-radius:4px;
        background:#15110d;padding:26px 28px}
  .card h2{margin:0 0 8px;font-size:19px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
  .card p{margin:0 0 16px;color:var(--dim);font-size:13.5px;line-height:1.65}
  .card .score{font:30px/1 ui-monospace,monospace;color:var(--green);margin:0 0 4px}
  .card .score.bad{color:var(--red)}
  .boot{text-align:center;color:var(--dim);font-style:italic;padding:60px 20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Anomaly Gallery</h1>
    <p class="tag">One painting at a time. Thirty seconds each. Find what should not be there.</p>
  </header>

  <div class="hud">
    <div class="clock" id="clock">30</div>
    <div class="barwrap"><div class="bar" id="bar"></div></div>
    <div class="pos" id="pos">– / –</div>
    <div class="found">found <b id="nfound">0</b> / <span id="ntotal">5</span></div>
    <button id="pause" disabled>Pause</button>
    <button id="skip" disabled>Skip ahead</button>
    <button id="again">New gallery</button>
    <button id="sound" title="Audio starts on your first click">Sound: on</button>
    <span class="nav">
      <a href="eye-graft.html">Eye graft</a>
      <a href="ops-lab.html">Ops lab</a>
      <a href="painterly-lab.html">Painterly</a>
      <a href="gaze-lab.html">Gaze lab</a>
      <a href="labs.html">How it works</a>
    </span>
    <div class="say" id="say">Look closely. Click anything that is wrong.</div>
  </div>

  <div class="gal" id="gal"><div class="boot">Unlocking the wing…</div></div>
</div>

<div class="veil" id="veil"><div class="card" id="card"></div></div>

<script type="module">
import {FilesetResolver,FaceLandmarker}
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $=s=>document.querySelector(s);

/* ========================= colour ========================= */
const rgb2hsl=(r,g,b)=>{r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0,s=0;
  if(d){s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=((b-r)/d+2);else h=((r-g)/d+4);h*=60;}
  return [h,s,l];};
const hsl2rgb=(h,s,l)=>{h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return [(r+m)*255,(g+m)*255,(b+m)*255];};

/* ========================= landmark rings ========================= */
const RING={
  eyeR:[33,7,163,144,145,153,154,155,133,173,157,158,159,160,161,246],
  eyeL:[362,382,381,380,374,373,390,249,263,466,388,387,386,385,384,398],
  mouth:[61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185]
};
const L={mouthR:61,mouthL:291,chin:152,irisL:473,irisR:468};
const pt=(f,i,W,H)=>({x:f[i].x*W,y:f[i].y*H});
function faceMetrics(f,W,H){
  let x0=1,y0=1,x1=0,y1=0;
  for(const p of f){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
  return {w:(x1-x0)*W,h:(y1-y0)*H,cx:(x0+x1)/2*W,cy:(y0+y1)/2*H};
}

/* ========================= harvest a body part ========================= */
function harvestFeature(srcCanvas,f,ringName,opt={}){
  // No alpha ramp here any more — the harvested patch comes out fully opaque and
  // graftFeature does all the blending, converging pixel values toward the host.
  // Two overlapping falloffs fought each other and produced the visible halo.
  const {expand=1.8,tall=1.25}=opt;
  const W=srcCanvas.width,H=srcCanvas.height;
  const ring=RING[ringName].map(i=>({x:f[i].x*W,y:f[i].y*H}));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,cx=0,cy=0;
  for(const p of ring){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);
    x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);cx+=p.x;cy+=p.y;}
  cx/=ring.length;cy/=ring.length;
  const bw=(x1-x0)*expand, bh=(y1-y0)*expand*tall;
  if(bw<8||bh<6) return null;
  const c=document.createElement("canvas");
  c.width=Math.round(bw);c.height=Math.round(bh);
  const x=c.getContext("2d",{willReadFrequently:true});
  x.drawImage(srcCanvas,cx-bw/2,cy-bh/2,bw,bh,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;
  for(let i=0;i<d.length;i+=4) d[i+3]=255;      // opaque; graftFeature blends
  x.putImageData(im,0,0);
  return {canvas:c,w:c.width,h:c.height,kind:ringName};
}

/* ========================= graft a part onto a surface ========================= */
function graftFeature(ctx,W,H,part,target,opt={}){
  // coreFrac: fraction of the patch radius that stays pure feature before the
  // blend toward the host begins. Lower dissolves more; higher keeps the
  // anomaly legible enough to be findable. 0.55 is the balance.
  const {sizeRel=2.0,rot=0.05,bulge=0.42,shadeAmt=0.45,
         crease=0.45,satKeep=1.35,coreFrac=0.55}=opt;
  const pre=document.createElement("canvas");
  pre.width=part.w;pre.height=part.h;
  const pc=pre.getContext("2d",{willReadFrequently:true});
  pc.drawImage(part.canvas,0,0);
  {const im=pc.getImageData(0,0,part.w,part.h),d=im.data;
   for(let i=0;i<d.length;i+=4){if(d[i+3]<4)continue;
     const [h,s,l]=rgb2hsl(d[i],d[i+1],d[i+2]);
     const [r,g,b]=hsl2rgb(h,Math.min(1,s*satKeep),l);
     d[i]=r;d[i+1]=g;d[i+2]=b;}
   pc.putImageData(im,0,0);}
  const ew=Math.max(12,Math.round(target.r*2*sizeRel));
  const eh=Math.max(8,Math.round(ew*(part.h/part.w)));
  const off=document.createElement("canvas");off.width=ew;off.height=eh;
  const ox=off.getContext("2d",{willReadFrequently:true});
  ox.drawImage(pre,0,0,ew,eh);
  if(bulge>0){
    const src=ox.getImageData(0,0,ew,eh),s=src.data;
    const out=ox.createImageData(ew,eh),o=out.data;
    const cx=ew/2,cy=eh/2;
    for(let y=0;y<eh;y++)for(let x=0;x<ew;x++){
      const nx=(x-cx)/cx,ny=(y-cy)/cy,r=Math.hypot(nx,ny);
      const k=r<1?1-bulge*(1-Math.sqrt(1-Math.min(1,r*r))):1;
      const fx=Math.max(0,Math.min(ew-1.001,cx+nx*cx*k));
      const fy=Math.max(0,Math.min(eh-1.001,cy+ny*cy*k));
      const x0=fx|0,y0=fy|0,ax=fx-x0,ay=fy-y0,di=(y*ew+x)*4;
      const x1=Math.min(ew-1,x0+1),y1=Math.min(eh-1,y0+1);
      for(let c=0;c<4;c++){
        const i00=(y0*ew+x0)*4+c,i10=(y0*ew+x1)*4+c,i01=(y1*ew+x0)*4+c,i11=(y1*ew+x1)*4+c;
        o[di+c]=(s[i00]*(1-ax)+s[i10]*ax)*(1-ay)+(s[i01]*(1-ax)+s[i11]*ax)*ay;
      }
    }
    ox.putImageData(out,0,0);
  }
  const px=Math.round(target.x-ew/2),py=Math.round(target.y-eh/2);
  const hx=Math.max(0,Math.min(W-ew,px)),hy=Math.max(0,Math.min(H-eh,py));
  const host=ctx.getImageData(hx,hy,ew,eh).data;
  let hm=0,n=0;
  for(let i=0;i<host.length;i+=4){ hm+=host[i]*0.299+host[i+1]*0.587+host[i+2]*0.114; n++; }
  hm/=n;
  /* CONVERGE TO HOST rather than fade out.
     Alpha-feathering left a visible coloured oval: the harvested pixels are
     another painting's skin, and the transition was far too narrow (the inner
     ~78% stayed fully opaque), so you saw a patch boundary made of colour.
     Here every pixel is written opaque, but its VALUE is blended toward the
     actual host pixel underneath. At the rim the output equals what was already
     there, so there is no boundary to see; inward it becomes the feature. */
  const im=ox.getImageData(0,0,ew,eh),d=im.data;
  const cx2=ew/2,cy2=eh/2;
  for(let y=0;y<eh;y++)for(let x=0;x<ew;x++){
    const i=(y*ew+x)*4;
    const nx=(x+0.5-cx2)/cx2, ny=(y+0.5-cy2)/cy2, r=Math.hypot(nx,ny);
    let wgt;
    if(r<=coreFrac) wgt=1;
    else if(r>=1) wgt=0;
    else { const t=1-(r-coreFrac)/(1-coreFrac); wgt=t*t*(3-2*t); }
    const hl=host[i]*0.299+host[i+1]*0.587+host[i+2]*0.114;
    const shade=1+((hl/Math.max(1,hm))-1)*shadeAmt;
    const k=r>0.55?Math.min(1,(r-0.55)/0.45)*crease:0;
    for(let c=0;c<3;c++){
      const v=d[i+c]*shade*(1-k*0.55);
      d[i+c]=Math.max(0,Math.min(255,host[i+c]*(1-wgt)+v*wgt));
    }
    d[i+3]=255;                                   // opaque everywhere
  }
  ox.putImageData(im,0,0);
  ctx.save();
  ctx.translate(target.x,target.y);ctx.rotate(rot);
  ctx.drawImage(off,-ew/2,-eh/2);ctx.restore();
  return [target.x-ew/2,target.y-eh/2,ew,eh];
}

/* ========================= liquify (face warps) ========================= */
function liquify(ctx,W,H,handles){
  const src=ctx.getImageData(0,0,W,H),s=src.data;
  const out=ctx.createImageData(W,H),o=out.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    let ox=0,oy=0;
    for(const h of handles){
      const dx=x-h.x,dy=y-h.y,d=Math.hypot(dx,dy);
      if(d>=h.r)continue;
      let t=1-d/h.r;t=t*t*(3-2*t);
      ox+=h.dx*t;oy+=h.dy*t;
    }
    let fx=Math.max(0,Math.min(W-1.001,x-ox)),fy=Math.max(0,Math.min(H-1.001,y-oy));
    const x0=fx|0,y0=fy|0,ax=fx-x0,ay=fy-y0,di=(y*W+x)*4;
    const x1=Math.min(W-1,x0+1),y1=Math.min(H-1,y0+1);
    for(let c=0;c<3;c++){
      const i00=(y0*W+x0)*4+c,i10=(y0*W+x1)*4+c,i01=(y1*W+x0)*4+c,i11=(y1*W+x1)*4+c;
      o[di+c]=(s[i00]*(1-ax)+s[i10]*ax)*(1-ay)+(s[i01]*(1-ax)+s[i11]*ax)*ay;
    }
    o[di+3]=255;
  }
  ctx.putImageData(out,0,0);
}
function opRictus(ctx,W,H,f,k=1){
  const m=faceMetrics(f,W,H),a=pt(f,L.mouthR,W,H),b=pt(f,L.mouthL,W,H);
  const sp=m.w*0.075*k,lift=m.h*0.035*k,r=m.w*0.30;
  liquify(ctx,W,H,[{x:a.x,y:a.y,dx:-sp,dy:-lift,r},{x:b.x,y:b.y,dx:sp,dy:-lift,r}]);
  const x0=Math.min(a.x,b.x)-r*0.6,y0=Math.min(a.y,b.y)-r*0.55;
  return [x0,y0,Math.abs(b.x-a.x)+r*1.2,r*1.1];
}
/* Radius 0.50 of face width, not 0.22. An eye is small and high-detail, so a
   tight falloff has a steep gradient across the eye itself and shears it — past
   about k=2.4 at r=0.22 the eye stopped being displaced and started being a
   smear, which is why this op could not simply be turned up. A wide radius puts
   the eye inside the plateau of the falloff, so it translates near-rigidly and
   the distortion is absorbed by the surrounding face. That buys 2.5x the
   displacement with no smearing: 7x10px -> 17x25px on a 181px face.
   The hit box stays sized to the eye and follows it, rather than growing with
   the falloff radius — otherwise clicking anywhere on the cheek would count. */
function opDrift(ctx,W,H,f,k=1){
  const m=faceMetrics(f,W,H),e=pt(f,L.irisL,W,H),r=m.w*0.50;
  const dx=m.w*0.024*k, dy=m.h*0.030*k;
  liquify(ctx,W,H,[{x:e.x,y:e.y,dx,dy,r}]);
  const hw=m.w*0.16;
  return [e.x+dx-hw,e.y+dy-hw,hw*2,hw*2];
}
/* Base 0.13 of face height, not 0.075. At the old strength this was ~13px on a
   164px face — perceptible only if you already knew where to look, which made
   it the one op you could never fairly find. Tested up to 0.26: past roughly
   0.20 the jaw becomes a tube and the mouth a vertical slot, which reads as
   caricature rather than as a face that is wrong. 0.13 x 1.5 sits just under
   that ceiling. The radius widens with it so the whole lower face lengthens
   instead of the chin alone sliding down. */
function opElongate(ctx,W,H,f,k=1){
  const m=faceMetrics(f,W,H),c=pt(f,L.chin,W,H),r=m.h*0.38;
  const dy=m.h*0.13*k;
  liquify(ctx,W,H,[{x:c.x,y:c.y,dx:0,dy,r}]);
  return [c.x-r*0.7,c.y-r*0.65,r*1.4,r*1.3+dy*0.6];
}

/* ============================================================================
   GLANCE — the one anomaly that is not in the paint.

   Every other op edits pixels and leaves them edited: the painting is wrong
   the moment it is hung, and the player's job is to notice. This one leaves
   the painting untouched. At rest it is the original canvas, pixel for pixel.
   What is wrong is that every few seconds the sitter looks aside.

   That makes it the only anomaly with no static answer — the box marks where
   the eyes are, not what was done to them, because nothing was done to them.

   Mechanically it is the gaze-lab rig: cut each iris out, reconstruct the
   sclera behind it, and re-stamp the iris a few pixels off centre. See
   gaze-lab.html for the measurements and for why the sclera has to be sampled
   as sclera rather than from the paint immediately around the iris.
   ========================================================================== */
const GAZE={eyeR:{c:468,iris:[469,470,471,472]},
            eyeL:{c:473,iris:[474,475,476,477]}};
const path0=pts=>{const p=new Path2D();
  pts.forEach((q,i)=>i?p.lineTo(q.x,q.y):p.moveTo(q.x,q.y)); p.closePath(); return p;};

/* Yaw proxy from nose-to-cheek asymmetry. 0 is frontal and it climbs as the
   head turns. Four landmark reads, no extra model output. Most old masters
   painted three-quarter, and sliding an iris inside a head that is turned away
   moves the pupil while the lid occlusion and the catchlight stay put — it
   reads as a rendering fault, not as a glance. */
function yawAsym(f,W,H){
  const n=pt(f,1,W,H), a=pt(f,234,W,H), b=pt(f,454,W,H);
  const da=Math.hypot(a.x-n.x,a.y-n.y), db=Math.hypot(b.x-n.x,b.y-n.y);

function buildGlanceEye(srcCv,f,W,H,ringName,opt={}){
  const {holeK=1.05, feather=0.14, blur=1}=opt;
  const ring=RING[ringName].map(i=>({x:f[i].x*W,y:f[i].y*H}));
  const g=GAZE[ringName];
  const c={x:f[g.c].x*W, y:f[g.c].y*H};
  let r=0; for(const i of g.iris) r+=Math.hypot(f[i].x*W-c.x, f[i].y*H-c.y);

  const bw=Math.min(W-bx,Math.ceil(eyeW+pad*2)), bh=Math.min(H-by,Math.ceil(eyeH+pad*2));
  if(bw<6||bh<6) return null;

  const path=path0(ring);
  const mk=document.createElement("canvas"); mk.width=bw; mk.height=bh;
  const mkx=mk.getContext("2d",{willReadFrequently:true});
  mkx.save(); mkx.translate(-bx,-by); mkx.fillStyle="#fff"; mkx.fill(path); mkx.restore();
  const MASK=mkx.getImageData(0,0,bw,bh).data;
  const inRing=(x,y)=>MASK[(y*bw+x)*4+3]>127;

     r=8.75 inside a 12px aperture — so a plain circular cut is more than half

  const SR=Math.max(2,Math.ceil(r*(1+feather))), sw=SR*2, sh=SR*2;

  const spx=sp.getContext("2d",{willReadFrequently:true});

    }

  const pl=document.createElement("canvas"); pl.width=bw; pl.height=bh;
  const plx=pl.getContext("2d",{willReadFrequently:true});
  plx.drawImage(srcCv,bx,by,bw,bh,0,0,bw,bh);
  {
    const im=plx.getImageData(0,0,bw,bh), d=im.data;
    const lx=c.x-bx, ly=c.y-by, R=r*holeK;
    const LU=k=>d[k]*0.299+d[k+1]*0.587+d[k+2]*0.114;
    const sc=[];
    for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){

    if(sc.length<8) return null;
    const lums=sc.map(LU).sort((a,b)=>a-b), cut=lums[Math.floor(lums.length*0.55)];
    let tr=0,tg=0,tb=0,tl=0,n=0;
    for(const k of sc){ if(LU(k)<cut) continue;
      tr+=d[k]; tg+=d[k+1]; tb+=d[k+2]; tl+=LU(k); n++; }
    if(!n) return null;
    tr/=n; tg/=n; tb/=n; tl=Math.max(1,tl/n);

    for(let y=0;y<bh;y++){

        if(Math.hypot(x+0.5-lx,y+0.5-ly)>R+1) continue;
        const k=(y*bw+x)*4;
        for(let ch=0;ch<3;ch++){

     sclera limit is roughly 3x that and would be a fully deviated stare. */
  return {c,r,bx,by,bw,bh,plate:pl,sprite:sp,SR,path,
          ballR:r*2.05, maxX:Math.max(0,eyeW/2-r), ox:0};
}

/* Builds the rig and returns the hit box. Deliberately does NOT touch ctx. */
function opGlance(ctx,W,H,f,rig){
  const eyes=[];
  for(const ringName of ["eyeR","eyeL"]){
    const e=buildGlanceEye(ctx.canvas,f,W,H,ringName);

  }

  rig.eyes=eyes;

                        x1=Math.max(x1,e.bx+e.bw); y1=Math.max(y1,e.by+e.bh); }

/* ========================= target finding ========================= */
/* Distance transform over a predicate mask, returning the top local maxima.
   Each is the centre of a coherent object, and `r` is the radius of the largest
   circle that fits INSIDE it — so anything drawn within r of the centre is
   guaranteed not to cross that object's boundary. */
function findBlobs(ctx,W,H,pred,box={},opt={}){
  const {x0=0,y0=0,x1=W,y1=H}=box;
  const {n=6,minR=8,close=5}=opt;
  const d=ctx.getImageData(0,0,W,H).data;
  let bin=new Float32Array(W*H);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const k=(y*W+x)*4;
    bin[y*W+x]=pred(d[k],d[k+1],d[k+2])?1:0;
  }
  /* Morphological closing, as a separable box blur re-thresholded.
     Without it a single apple fragments: the predicate rejects its specular
     highlight and its shadowed side, so the mask becomes several slivers and
     the inscribed radius badly underestimates the object — r=11 for fruit that
     is really r=21. Closing roughly doubles the radii and is the difference
     between "no target fits" and a graft that sits inside the fruit. */
  if(close>0){
    const tmp=new Float32Array(W*H), out=new Float32Array(W*H), win=close*2+1;
    for(let y=y0;y<y1;y++){ let s=0;
      for(let x=x0;x<x1;x++){ s+=bin[y*W+x];
        if(x-x0>=win) s-=bin[y*W+x-win];
        tmp[y*W+Math.max(x0,x-close)]=s/win; } }
    for(let x=x0;x<x1;x++){ let s=0;
      for(let y=y0;y<y1;y++){ s+=tmp[y*W+x];
        if(y-y0>=win) s-=tmp[(y-win)*W+x];
        out[Math.max(y0,y-close)*W+x]=s/win; } }
    for(let i=0;i<W*H;i++) bin[i]=out[i]>0.42?1:0;
  }
  const m=new Float32Array(W*H);
  for(let i=0;i<W*H;i++) m[i]=bin[i]?Infinity:0;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const i=y*W+x;if(m[i]===0)continue;
    let v=m[i];
    if(x>x0)v=Math.min(v,m[i-1]+1);
    if(y>y0)v=Math.min(v,m[i-W]+1);
    if(x>x0&&y>y0)v=Math.min(v,m[i-W-1]+1.414);
    if(x<x1-1&&y>y0)v=Math.min(v,m[i-W+1]+1.414);
    m[i]=v;
  }
  const cand=[];
  for(let y=y1-1;y>=y0;y--)for(let x=x1-1;x>=x0;x--){
    const i=y*W+x;if(m[i]===0)continue;
    let v=m[i];
    if(x<x1-1)v=Math.min(v,m[i+1]+1);
    if(y<y1-1)v=Math.min(v,m[i+W]+1);
    if(x<x1-1&&y<y1-1)v=Math.min(v,m[i+W+1]+1.414);
    if(x>x0&&y<y1-1)v=Math.min(v,m[i+W-1]+1.414);
    m[i]=v;
    if(v>=minR) cand.push({x,y,r:v});
  }
  // Non-max suppression: keep maxima that do not sit inside an already-kept
  // circle, so we get one candidate per object rather than a cluster on one.
  cand.sort((a,b)=>b.r-a.r);
  const keep=[];
  for(const c of cand){
    if(keep.some(k=>Math.hypot(k.x-c.x,k.y-c.y)<k.r)) continue;
    keep.push({x:c.x,y:c.y,r:Math.round(c.r)});
    if(keep.length>=n) break;
  }
  return keep;
}

   the canvas reads as a bug, not an anomaly. */
function validBlob(b,box){
  if(!b) return null;
  const clear=Math.max(6,b.r*0.8);
  if(b.x-clear<box.x0||b.x+clear>box.x1||b.y-clear<box.y0||b.y+clear>box.y1) return null;

/* Fit a graft INSIDE the object instead of over it.
   `r` from findBlobs is the inscribed radius, so a w×h box centred on the blob
   stays within the object exactly when its half-diagonal <= r. For an eye
   (h ≈ 0.45w) that caps width at about 1.8r.

   The previous version clamped the drawn size to an absolute pixel band and
   ignored r completely — on a small fruit (r=9, i.e. 18px across) it still drew
   a 38px eye, which is why grafts spilled across object boundaries. Returns
   null when the object is simply too small to host a legible graft, so the
   caller can try the next candidate rather than forcing a bad one. */
function fitGraft(blobR,aspect,minPx,maxPx){
  const halfDiag=Math.sqrt(1+aspect*aspect)/2;   // per unit of width
  const maxW=(blobR*0.94)/halfDiag;              // 6% margin inside the edge
  const w=Math.min(maxW,maxPx);
  if(w<minPx) return null;
  return w/(blobR*2);                            // -> sizeRel for graftFeature
}

async function resolveAll(titles){

        + `&iiurlwidth=1000&titles=${encodeURIComponent(titles.join("|"))}`;
  const res=await fetch(u);const txt=await res.text();
  if(!txt.trim().startsWith("{")) throw new Error("Commons is rate-limiting. Wait a few seconds and press New gallery.");

    [138,146].forEach((f,i)=>{             // a semitone apart: sour, not scary
      const o=ctx.createOscillator(); o.type="triangle"; o.frequency.value=f;
      const g=ctx.createGain();
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.11,t+0.25);
      g.gain.exponentialRampToValueAtTime(0.0001,t+1.9);
      o.connect(g); g.connect(master); g.connect(verbIn);
      o.start(t); o.stop(t+2);
    });
  }
  function tick(){
    if(!ctx||muted) return;
    const t=now();
    const o=ctx.createOscillator(); o.type="square"; o.frequency.value=1120;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.08);
  }
  function setMuted(m){
    muted=m;
    if(master) master.gain.linearRampToValueAtTime(m?0:0.85,now()+0.25);
  }
  return {startBgm,found,wrong,reveal,tick,setMuted,
          isMuted:()=>muted, ready:()=>!!ctx};
})();

/* ========================= game ========================= */
const ROUND_MS=30000, PENALTY=3000, DISPW=620;
const ROUNDS=5;              // paintings per gallery
const UNIQUE_MODES=true;     // each painting wrong in a different way
let STATE=null, TICK=null;

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

let FL=null;
async function landmarker(){
  if(FL) return FL;
  const fs=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  FL=await FaceLandmarker.createFromOptions(fs,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"},
    runningMode:"IMAGE",numFaces:1});
  return FL;
}

async function build(){
  clearInterval(TICK);
  stopAllBlinking();          // a previous round's blink would outlive its canvas
  $("#veil").classList.remove("on");
  $("#gal").innerHTML='<div class="boot">Unlocking the wing…</div>';
  $("#again").disabled=true;
  $("#say").className="say"; $("#say").textContent="Hanging the collection…";

  const fl=await landmarker();

  // choose 5: three with faces, two still lifes, so both op families can fire
  const man=await getManifest();
  let chosen, urls;
  if(man){
    // curated local assets: selection is guaranteed-eligible, no detection roulette
    const pool=man.items;
    // Over-fetch: three of the five modes need a face and two need a graft
    // target, and detection still fails on some paintings, so spares are what
    // make a full five-round gallery reliable rather than lucky.
    const f=shuffle(pool.filter(p=>p.hasFace)).slice(0,5);
    const s=shuffle(pool.filter(p=>!p.hasFace&&p.blob)).slice(0,4);
    const fill=shuffle(pool.filter(p=>!f.includes(p)&&!s.includes(p)));
    chosen=shuffle([...f,...s]);
    while(chosen.length<9&&fill.length) chosen.push(fill.pop());
    chosen=chosen.map(p=>({t:p.file,n:p.name,a:p.artist,y:p.year,
                           kind:p.hasFace?"face":"still",blob:p.blob,src:p.source}));
    urls=Object.fromEntries(chosen.map(c=>[c.t,"assets/"+c.t]));
  }else{
    const f=shuffle(POOL.filter(p=>p.kind==="face")).slice(0,5);
    const s=shuffle(POOL.filter(p=>p.kind==="still"||p.kind==="both")).slice(0,4);
    chosen=shuffle([...f,...s]);
    urls=await resolveAll(chosen.map(c=>c.t));
  }

  const works=[];
  await Promise.all(chosen.map(async spec=>{
    const u=urls[spec.t]; if(!u) return;
    try{
      const img=await loadImg(u);
      const H=Math.round(img.height*(DISPW/img.width));
      const c=document.createElement("canvas");c.width=DISPW;c.height=H;
      c.getContext("2d",{willReadFrequently:true}).drawImage(img,0,0,DISPW,H);
      works.push({spec,img,canvas:c,W:DISPW,H});
    }catch(e){}
  }));
  if(works.length<3){ fail("Could not load enough paintings. Press New gallery."); return; }

  // analyse
  for(const w of works){
    const res=fl.detect(w.canvas);
    w.face=res.faceLandmarks&&res.faceLandmarks[0]||null;
    const ctx=w.canvas.getContext("2d",{willReadFrequently:true});
    // fruit-like target, avoiding the face if there is one.
    // Generous margins: a graft that runs off the edge of the canvas reads as
    // a rendering bug rather than an anomaly.
    let box={x0:Math.round(w.W*0.16),y0:Math.round(w.H*0.30),
             x1:Math.round(w.W*0.84),y1:Math.round(w.H*0.88)};
    if(w.face){
      const m=faceMetrics(w.face,w.W,w.H);
      box.y0=Math.max(box.y0,Math.round(m.cy+m.h*0.55));
      if(box.y1-box.y0<50) box={x0:Math.round(w.W*0.16),y0:Math.round(w.H*0.55),
                                x1:Math.round(w.W*0.84),y1:Math.round(w.H*0.90)};
    }
    // curated manifests carry a pre-computed, hand-checked target in normalised
    // coords — no distance transform at load, and no bad targets slipping through
    // curate.html writes the whole candidate list; older manifests carry a
    // single `blob`, and a one-element list behaves the same as before.
    const pre=w.spec.blobs&&w.spec.blobs.length ? w.spec.blobs
            : (w.spec.blob ? [w.spec.blob] : null);
    if(pre){
      w.blobs=pre.map(b=>({x:Math.round(b.x*w.W),
                           y:Math.round(b.y*w.H),
                           r:Math.round(b.r*w.W)}));
    }else{
      // Keep several candidates, largest first. One target is not enough: if the
      // biggest object is too small to host a legible eye we need somewhere else
      // to put it, rather than oversizing the graft past the object's edge.
      let cands=findBlobs(ctx,w.W,w.H,warmMass,box,{n:6})
                  .map(b=>validBlob(b,box)).filter(Boolean);
      if(cands.length<2){
        for(const c of findBlobs(ctx,w.W,w.H,anyMass,box,{n:6}).map(b=>validBlob(b,box)).filter(Boolean)){
          if(!cands.some(k=>Math.hypot(k.x-c.x,k.y-c.y)<Math.max(k.r,c.r))) cands.push(c);
        }
      }
      cands.sort((a,b)=>b.r-a.r);
      w.blobs=cands;
    }
    w.blob=w.blobs[0]||null;
    // can any candidate host a graft at all? (nominal eye aspect 0.5)
    w.graftable=w.blobs.some(b=>fitGraft(b.r,0.5,w.W*0.055,w.W*0.14)!==null);
    w.clean=ctx.getImageData(0,0,w.W,w.H);
    w.cleanCv=snap(w.canvas);       // the painting before any anomaly — the "lid"
  }

  // harvest parts from a hi-res portrait
  let parts=[];
  const donor=works.find(w=>w.face);
  if(donor){
    const HR=900, hh=Math.round(donor.img.height*(HR/donor.img.width));
    const hc=document.createElement("canvas");hc.width=HR;hc.height=hh;
    hc.getContext("2d",{willReadFrequently:true}).drawImage(donor.img,0,0,HR,hh);
    const hres=fl.detect(hc);
    if(hres.faceLandmarks&&hres.faceLandmarks.length){
      const hf=hres.faceLandmarks[0];
      for(const ring of ["eyeL","eyeR","mouth"]){
        const p=harvestFeature(hc,hf,ring,{expand:ring==="mouth"?1.5:1.8,
                                           tall:ring==="mouth"?1.1:1.25});
        if(p) parts.push(p);
      }
    }
  }

  /* ---- one distinct mode per painting ----
     There are exactly five modes and exactly five rounds, so by default each
     painting is wrong in a different way and no trick repeats within a gallery.
     Assignment is a small matching problem, not a per-painting roll: each mode
     has an eligibility test (a face, or a graft target plus a harvested part of
     the right kind), and modes are handed to the first spare painting that can
     host them. Over-fetching earlier is what keeps this from coming up short. */
  const haveEye   = parts.some(p=>p.kind!=="mouth");
  const haveMouth = parts.some(p=>p.kind==="mouth");
  /* glance needs a frontal sitter, and it must never land on the same painting
     as drift: one warps the eye, the other re-stamps the iris from the
     unwarped landmarks, so the two would fight over the same pixels. The
     one-mode-per-painting assignment below already guarantees that, and this
     is the reason it must stay that way. */
  const MODES=[
    {id:"drift",      fits:w=>!!w.face},
    {id:"rictus",     fits:w=>!!w.face},
    {id:"elongate",   fits:w=>!!w.face},
    {id:"glance",     fits:w=>!!w.face&&yawAsym(w.face,w.W,w.H)<=YAW_MAX},
    {id:"graftEye",   fits:w=>w.graftable&&haveEye},
    {id:"graftMouth", fits:w=>w.graftable&&haveMouth}
  ];
  const slots=shuffle(works.map((w,i)=>({w,i})));
  const taken=new Set(), rounds=[];
  for(const mode of shuffle(MODES.slice())){
    if(rounds.length>=ROUNDS) break;
    const slot=slots.find(s=>!taken.has(s.i)&&mode.fits(s.w));
    if(!slot) continue;
    taken.add(slot.i);
    rounds.push({work:slot.i,mode:mode.id});
  }
  // short of five? repeat a mode rather than run a short gallery — five rounds
  // matters more than perfect variety on a bad draw
  if(rounds.length<ROUNDS){
    for(const s of slots){
      if(rounds.length>=ROUNDS) break;
      if(taken.has(s.i)) continue;
      const m=shuffle(MODES.slice()).find(m=>m.fits(s.w));
      if(!m) continue;
      taken.add(s.i);
      rounds.push({work:s.i,mode:m.id});
    }
  }
  if(!rounds.length){ fail("No anomaly could be placed. Press New gallery."); return; }
  shuffle(rounds);

  // ---- apply ----
  const anomalies=[];
  for(const r of rounds){
    const w=works[r.work];
    const ctx=w.canvas.getContext("2d",{willReadFrequently:true});
    w.anomalies=[];
    {
      const mode=r.mode;
      const op=mode.startsWith("graft")?"graft":mode;
      let box=null,label="",kind=null,tone=null,grain=null;
      const rig={};
      if(op==="rictus"){ box=opRictus(ctx,w.W,w.H,w.face,1.0); label="the mouth is not one a face can make"; }
      else if(op==="glance"){ box=opGlance(ctx,w.W,w.H,w.face,rig); label="the sitter keeps looking aside"; }
      else if(op==="drift"){ box=opDrift(ctx,w.W,w.H,w.face,4.0); label="one eye has drifted out of true"; }
      else if(op==="elongate"){ box=opElongate(ctx,w.W,w.H,w.face,1.5); label="the jaw has been drawn down"; }
      else{
        // the mode dictates which body part, so a gallery never repeats a trick
        const want=mode==="graftMouth"?"mouth":"eye";
        const pick=parts.filter(p=>(p.kind==="mouth")===(want==="mouth"));
        const part=(pick.length?pick:parts)[(Math.random()*(pick.length||parts.length))|0];
        const aspect=part.h/part.w;
        // walk candidates largest-first and take the first that can hold the
        // graft entirely inside its own boundary
        let target=null,sz=null;
        for(const b of w.blobs){
          const s=fitGraft(b.r,aspect,w.W*0.055,w.W*0.14);
          if(s){ target=b; sz=s*(part.kind==="mouth"?0.9:1); break; }
        }
        if(!target) break;
        box=graftFeature(ctx,w.W,w.H,part,target,{
          sizeRel:sz,
          rot:(Math.random()-0.5)*0.30,bulge:0.42,shadeAmt:0.45,
          crease:0.45,satKeep:1.35,coreFrac:0.55});
        kind=part.kind;                       // "eyeL" | "eyeR" | "mouth"
        if(kind==="mouth"){
          // sampled once at build time — the cavity's palette and surface noise
          tone=shadowTone(w.cleanCv,target.x,target.y,Math.round(target.r*3));
          grain=grainFrom(w.cleanCv,target.x-40,target.y-40,70,50);
        }
        label=part.kind==="mouth"?"there is a mouth where none belongs"
                                 :"there is an eye where none belongs";
      }
      if(box){
        const a={op,mode,box,label,kind,tone,grain,found:false,eyes:rig.eyes||null};
        w.anomalies.push(a); anomalies.push(a);
      }
    }
    w.dirty=ctx.getImageData(0,0,w.W,w.H);
    w.dirtyCv=snap(w.canvas);       // the altered painting — the "eye open" state
  }
  // a round whose ops all failed to place would be unwinnable
  for(let i=rounds.length-1;i>=0;i--)
    if(!works[rounds[i].work].anomalies.length) rounds.splice(i,1);
  if(!rounds.length){ fail("No anomaly could be placed. Press New gallery."); return; }

  STATE={works,rounds,idx:-1,anomalies,found:0,
         total:anomalies.length,over:false,roundOver:true,endAt:0};
  $("#ntotal").textContent=STATE.total;
  $("#nfound").textContent="0";
  $("#again").disabled=false;
  nextRound();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const snap=cv=>{const c=document.createElement("canvas");c.width=cv.width;c.height=cv.height;
  c.getContext("2d").drawImage(cv,0,0);return c;};

/* ============================================================================
   BLINK — the reward, not the anomaly.
   Motion is the strongest salience cue the visual system has, so a blinking eye
   during the hunt would be findable in peripheral vision without looking at the
   painting at all. It stays perfectly still until the player clicks it; then it
   blinks at once, and keeps blinking.

   There is no eyelid sprite. The lid is the host surface itself, taken from the
   pre-anomaly painting and swept down over the graft — the fruit skinning back
   over its own eye. Only grafts blink: for a face warp the clean layer holds the
   *un-warped* feature, so sweeping it would reveal the answer rather than blink.
   ========================================================================== */
function drawBlink(w,a,p){
  const g=w.canvas.getContext("2d");
  const X=Math.max(0,Math.floor(a.box[0])), Y=Math.max(0,Math.floor(a.box[1]));
  const BW=Math.min(w.W-X,Math.ceil(a.box[2])), BH=Math.min(w.H-Y,Math.ceil(a.box[3]));
  if(BW<=0||BH<=0) return;
  g.drawImage(w.dirtyCv, X,Y,BW,BH, X,Y,BW,BH);              // open
  if(p<=0.001) return;
  /* The lid's leading edge is feathered for the same reason the cavity is: a
     straight drawImage of the clean layer leaves a hard horizontal cut across
     painted texture. Sides and top need no feather — the graft's own alpha
     already falls to zero there, so clean and dirty agree at the box border. */
  const lid=BH*p, f=Math.min(4,Math.max(1.5,BH*0.22));
  const off=document.createElement("canvas"); off.width=BW; off.height=BH;
  const o=off.getContext("2d");
  o.drawImage(w.cleanCv, X,Y,BW,BH, 0,0,BW,BH);
  o.globalCompositeOperation="destination-in";
  const gr=o.createLinearGradient(0,lid-f,0,lid);
  gr.addColorStop(0,"rgba(0,0,0,1)"); gr.addColorStop(1,"rgba(0,0,0,0)");
  o.fillStyle=gr; o.fillRect(0,0,BW,BH);
  g.drawImage(off,X,Y);                                       // host surface closes over it
}
function startBlinking(w,a){
  if(a.blinking) return;
  a.blinking=true;
  const CLOSE=90, HOLD=70, OPEN=130, TOTAL=CLOSE+HOLD+OPEN;
  const cycle=()=>{
    if(!a.blinking||!STATE||STATE.over) return;
    const t0=performance.now();
    const step=()=>{
      if(!a.blinking||!STATE||STATE.over) return;
      const t=performance.now()-t0;
      let p;
      if(t<CLOSE) p=t/CLOSE;
      else if(t<CLOSE+HOLD) p=1;
      else if(t<TOTAL) p=1-(t-CLOSE-HOLD)/OPEN;
      else p=0;
      drawBlink(w,a,p);
      if(t<TOTAL) a.raf=requestAnimationFrame(step);
      else { drawBlink(w,a,0); a.timer=setTimeout(cycle, 2400+Math.random()*3600); }
    };
    a.raf=requestAnimationFrame(step);
  };
  cycle();                                    // blink immediately on being found
}
function stopBlinking(a){
  a.blinking=false;
  a.glancing=false;
  if(a.raf) cancelAnimationFrame(a.raf);
  if(a.timer) clearTimeout(a.timer);
  a.raf=a.timer=null;
  // leave the sitter looking ahead rather than frozen mid-glance
  if(a.drawRest) a.drawRest();
}

/* ============================================================================
   GLANCE, animated.

   Unlike the blink, this runs DURING the hunt — it has to, because it is the
   anomaly rather than the reward for finding it. That is a deliberate break
   with the rule the blink exists to obey, and it costs something: motion is
   the strongest salience cue there is, so this is the easiest anomaly in the
   game and no amount of tuning makes it hard. What the numbers below buy is a
   chance of missing it, not difficulty.

     GAP    how long the sitter holds still. Long enough that a player
            scanning the lower half of the canvas can be looking away.
     OUT    ease aside. Fast — a saccade is quick, and a slow slide reads as
            a drifting eye rather than a look.
     HOLD   how long the look is held.
     BACK   ease front again, slower than the way out.

   Direction alternates rather than being random, so the sitter reads as
   looking around the room instead of twitching.
   ========================================================================== */
/* DEG is 21.3 rather than 14 because travel is ballR*sin(theta), so getting
   50% more movement means 50% more sine, not 50% more angle:
   asin(1.5 * sin 14) = 21.28. That is 6.5px against 4.3px on a 620px canvas.
   Headroom is now thin — the narrower eye measured maxX=7.0px — so on some
   sitters Math.min below will start clamping to the sclera edge rather than
   the requested angle. That is the intended failure: the iris stops at the
   corner instead of sliding under the lid. */
const GLANCE={GAP:[3600,7200], FIRST:[2200,4800], OUT:285, HOLD:[930,1725], BACK:420,
              DEG:21.3};
const rnd=([a,b])=>a+Math.random()*(b-a);

function drawGlance(w,a){
  const g=w.canvas.getContext("2d");
  for(const e of a.eyes){
    g.drawImage(w.dirtyCv, e.bx,e.by,e.bw,e.bh, e.bx,e.by,e.bw,e.bh);   // rest
    g.drawImage(e.plate, e.bx, e.by);                                    // iris gone
    g.save(); g.clip(e.path);
    g.drawImage(e.sprite, e.c.x-e.SR+e.ox, e.c.y-e.SR);
    g.restore();
  }
}
function startGlancing(w,a){
  if(a.glancing) return;
  a.glancing=true;
  a.dir=a.dir||1;
  a.drawRest=()=>{ for(const e of a.eyes) e.ox=0; drawGlance(w,a); };
  const cycle=()=>{
    if(!a.glancing||!STATE||STATE.over||STATE.paused) return;
    a.dir=-a.dir;
    const hold=rnd(GLANCE.HOLD), total=GLANCE.OUT+hold+GLANCE.BACK;
    const t0=performance.now();
    const step=()=>{
      if(!a.glancing||!STATE||STATE.over||STATE.paused) return;
      const t=performance.now()-t0;
      let p;
      if(t<GLANCE.OUT) p=t/GLANCE.OUT;
      else if(t<GLANCE.OUT+hold) p=1;
      else if(t<total) p=1-(t-GLANCE.OUT-hold)/GLANCE.BACK;
      else p=0;
      p=p*p*(3-2*p);
      for(const e of a.eyes){
        const k=Math.min(e.maxX, e.ballR*Math.sin(GLANCE.DEG*Math.PI/180))*a.dir;
        e.ox=k*p;
      }
      drawGlance(w,a);
      if(t<total) a.raf=requestAnimationFrame(step);
      else { for(const e of a.eyes) e.ox=0; drawGlance(w,a);
             a.timer=setTimeout(cycle, rnd(GLANCE.GAP)); }
    };
    a.raf=requestAnimationFrame(step);
  };
  // the first look is delayed, so the painting is still when it is first hung
  a.timer=setTimeout(cycle, rnd(GLANCE.FIRST));
}
function stopAllBlinking(){
  if(!STATE||!STATE.anomalies) return;
  for(const a of STATE.anomalies) stopBlinking(a);
}

/* ============================================================================
   MOUTH — a cavity opening, which is NOT a blink in reverse.
   Neither layer contains a dark interior: the clean layer is undisturbed fruit,
   the dirty layer a closed painted mouth. The cavity has to be synthesised, and
   the thing that keeps it looking painted rather than like a hole punched in the
   canvas is that it is never black. Old-master shadows are warm browns, so the
   fill is sampled from the painting's own darkest tones and the canvas grain is
   laid back over the top.
   ========================================================================== */
function shadowTone(cv,cx,cy,rad){
  const x=Math.max(0,Math.round(cx-rad)),y=Math.max(0,Math.round(cy-rad));
  const w=Math.min(cv.width-x,Math.round(rad*2)),h=Math.min(cv.height-y,Math.round(rad*2));
  if(w<2||h<2) return [40,32,26];
  const d=cv.getContext("2d",{willReadFrequently:true}).getImageData(x,y,w,h).data;
  const l=[];
  for(let i=0;i<d.length;i+=4) l.push([d[i]*.299+d[i+1]*.587+d[i+2]*.114,i]);
  l.sort((a,b)=>a[0]-b[0]);
  const take=Math.max(1,Math.floor(l.length*0.12));   // darkest 12%
  let r=0,g=0,b=0;
  for(let k=0;k<take;k++){const i=l[k][1];r+=d[i];g+=d[i+1];b+=d[i+2];}
  return [r/take,g/take,b/take];
}
function grainFrom(cv,sx,sy,sw,sh){
  sx=Math.max(0,sx);sy=Math.max(0,sy);
  sw=Math.min(cv.width-sx,sw);sh=Math.min(cv.height-sy,sh);
  if(sw<3||sh<3) return null;
  const s=cv.getContext("2d",{willReadFrequently:true}).getImageData(sx,sy,sw,sh).data;
  const hp=new Float32Array(sw*sh);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
    let sum=0,n=0;
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
      const px=x+i,py=y+j; if(px<0||py<0||px>=sw||py>=sh)continue;
      const k=(py*sw+px)*4; sum+=s[k]*.299+s[k+1]*.587+s[k+2]*.114; n++;
    }
    const k=(y*sw+x)*4,l=s[k]*.299+s[k+1]*.587+s[k+2]*.114;
    hp[y*sw+x]=l-sum/n;
  }
  return {hp,w:sw,h:sh};
}
function drawMouth(w,a,p){
  const ctx=w.canvas.getContext("2d",{willReadFrequently:true});
  const [bx,by,bw,bh]=a.box;
  const X=Math.max(0,Math.floor(bx)),Y=Math.max(0,Math.floor(by));
  const BW=Math.min(w.W-X,Math.ceil(bw)),BH=Math.min(w.H-Y,Math.ceil(bh));
  if(BW<=0||BH<=0) return;
  ctx.drawImage(w.dirtyCv,X,Y,BW,BH,X,Y,BW,BH);      // shut
  if(p<=0.001) return;
  const tone=a.tone||[40,32,26];
  const cx=bx+bw/2, cy=by+bh*0.52;
  const aw=bw*0.74, ah=bh*0.90*p;                    // corners stay shut
  if(ah<1) return;
  const dark=[tone[0]*0.30,tone[1]*0.28,tone[2]*0.26];
  const mid =[tone[0]*0.62,tone[1]*0.58,tone[2]*0.55];
  const rim =[Math.min(255,tone[0]*1.45),Math.min(255,tone[1]*1.35),Math.min(255,tone[2]*1.25)];
  const rgb=c=>`rgb(${c.map(v=>Math.round(v)).join(",")})`;
  /* Built on an offscreen and composited with a per-pixel feathered alpha.
     ctx.clip() on an ellipse gives a 1px vector boundary, and against painted
     texture that hard edge is the single thing that makes the cavity read as
     pasted on. The feather band is computed in normalised ellipse space but
     floored in pixels, so a thin aperture still gets a visible soft edge. */
  const A=aw/2, Bx=ah/2;
  /* Feather as a CONSTANT PIXEL WIDTH inward from the boundary, not a fraction
     of the radius. The aperture is only ~10px tall, so a fractional band ate 66%
     of it and the cavity never reached full opacity — it read as a translucent
     smudge rather than a hole. This keeps the core solid at any size. */
  const FE=Math.min(2.6,Math.max(1.1,Math.min(A,Bx)*0.34));
  const lx=cx-X, ly=cy-Y;                     // aperture centre in offscreen space
  const off=document.createElement("canvas"); off.width=BW; off.height=BH;
  const o=off.getContext("2d",{willReadFrequently:true});
  const g=o.createRadialGradient(lx,ly-ah*0.18,Math.max(1,ah*0.05),lx,ly,Math.max(aw,ah)/2);
  g.addColorStop(0,rgb(dark)); g.addColorStop(0.62,rgb(mid)); g.addColorStop(1,rgb(rim));
  o.fillStyle=g; o.fillRect(0,0,BW,BH);
  const sh=o.createLinearGradient(0,ly-ah/2,0,ly+ah*0.1);     // roof of the cavity
  sh.addColorStop(0,"rgba(0,0,0,0.55)"); sh.addColorStop(1,"rgba(0,0,0,0)");
  o.fillStyle=sh; o.fillRect(0,0,BW,BH);
  o.save();                                                   // lit rim, feathered with the rest
  o.beginPath(); o.ellipse(lx,ly,aw/2,ah/2,0,0,Math.PI*2);
  o.strokeStyle=`rgba(${rim.map(v=>Math.round(v)).join(",")},0.5)`;
  o.lineWidth=Math.max(0.8,ah*0.06); o.stroke(); o.restore();
  const im=o.getImageData(0,0,BW,BH), d=im.data;
  for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){
    const i=(y*BW+x)*4;
    // distance from the ellipse F=1 is approximately (1-F)*F / |grad F|
    const nx=(x+0.5-lx)/A, ny=(y+0.5-ly)/Bx, F=Math.hypot(nx,ny);
    let al;
    if(F<=1e-6) al=1;
    else{
      const grad=Math.hypot(nx/A,ny/Bx);
      const dist=(1-F)*F/Math.max(1e-6,grad);          // px inward from the edge
      al = dist<=0 ? 0 : dist>=FE ? 1 : (t=>t*t*(3-2*t))(dist/FE);
    }
    if(al>0&&a.grain){
      const gg=a.grain.hp[(y%a.grain.h)*a.grain.w+(x%a.grain.w)]*0.55;
      for(let c=0;c<3;c++) d[i+c]=Math.max(0,Math.min(255,d[i+c]+gg));
    }
    d[i+3]=Math.round(al*255);
  }
  o.putImageData(im,0,0);
  ctx.drawImage(off,X,Y);
}
/* Slower than a blink on purpose — an unhurried opening is worse than a fast one. */
function startMouthing(w,a){
  if(a.blinking) return;
  a.blinking=true;
  const OPEN=430, HOLD=900, SHUT=540, TOTAL=OPEN+HOLD+SHUT;
  const cycle=()=>{
    if(!a.blinking||!STATE||STATE.over) return;
    const t0=performance.now();
    const step=()=>{
      if(!a.blinking||!STATE||STATE.over) return;
      const t=performance.now()-t0;
      let p;
      if(t<OPEN) p=t/OPEN;
      else if(t<OPEN+HOLD) p=1;
      else if(t<TOTAL) p=1-(t-OPEN-HOLD)/SHUT;
      else p=0;
      drawMouth(w,a,p*p*(3-2*p));                    // ease
      if(t<TOTAL) a.raf=requestAnimationFrame(step);
      else { drawMouth(w,a,0); a.timer=setTimeout(cycle, 3200+Math.random()*4200); }
    };
    a.raf=requestAnimationFrame(step);
  };
  cycle();
}

function nextRound(){
  if(!STATE||STATE.over) return;
  clearInterval(TICK);
  STATE.idx++;
  if(STATE.idx>=STATE.rounds.length){ finish(); return; }
  const w=STATE.works[STATE.rounds[STATE.idx].work];
  STATE.roundOver=false;
  STATE.endAt=performance.now()+ROUND_MS;
  paintOne(w);
  $("#pos").textContent=`${STATE.idx+1} / ${STATE.rounds.length}`;
  $("#skip").disabled=false;
  $("#pause").disabled=false; $("#pause").textContent="Pause";
  STATE.paused=false; $("#gal").classList.remove("paused");
  const n=w.anomalies.length;
  say("", n===1 ? "One thing here is wrong." : `${n} things here are wrong.`);
  // the only anomaly that animates before it is found
  for(const a of w.anomalies) if(a.op==="glance") startGlancing(w,a);
  TICK=setInterval(tick,100);
  tick();
}

function paintOne(w){
  const gal=$("#gal"); gal.innerHTML="";
  const plate=document.createElement("div");
  plate.className="plate";
  plate.innerHTML=`<div class="mount"><div class="mat"></div></div>
    <div class="cap"><b>${esc(w.spec.n)}</b><i>${esc(w.spec.a)}${w.spec.y?" · "+esc(w.spec.y):""}</i></div>`;
  plate.querySelector(".mat").appendChild(w.canvas);
  w.canvas.onclick=ev=>onClick(ev,w);
  gal.appendChild(plate);
  w.plate=plate;
}

function onClick(ev,w){
  if(!STATE||STATE.over||STATE.roundOver||STATE.paused) return;
  const c=w.canvas, r=c.getBoundingClientRect();
  const x=(ev.clientX-r.left)*(c.width/r.width);
  const y=(ev.clientY-r.top)*(c.height/r.height);
  const hit=w.anomalies.find(a=>{
    if(a.found) return false;
    const [bx,by,bw,bh]=a.box, pad=14;
    return x>=bx-pad&&x<=bx+bw+pad&&y>=by-pad&&y<=by+bh+pad;
  });
  if(hit){
    hit.found=true; STATE.found++;
    $("#nfound").textContent=STATE.found;
    ringMark(c,hit.box,"rgba(127,163,104,.95)");
    // the reward: it was still while you looked for it, and now it isn't
    SND.found(hit.kind);
    if(hit.op==="graft"){
      if(hit.kind==="mouth") startMouthing(w,hit);   // a cavity opens
      else                   startBlinking(w,hit);   // an eye blinks
    }
    const left=w.anomalies.filter(a=>!a.found).length;
    if(left===0){ say("good","Found it — "+hit.label+"."); endRound(true); }
    else say("good",`Found it — ${hit.label}. ${left} more here.`);
  }else{
    STATE.endAt-=PENALTY;
    SND.wrong();
    say("bad","Nothing wrong there. −3 seconds.");
  }
}

/* Ends the current painting: reveals anything missed, then moves on. Called by
   the clock running out, by clearing the painting, and by Skip. */
function endRound(cleared){
  if(!STATE||STATE.roundOver) return;
  STATE.roundOver=true;
  clearInterval(TICK);
  $("#skip").disabled=true; $("#pause").disabled=true;
  $("#gal").classList.remove("paused");
  const w=STATE.works[STATE.rounds[STATE.idx].work];
  const missed=w.anomalies.filter(a=>!a.found);
  for(const a of missed) ringMark(w.canvas,a.box,"rgba(184,53,44,.9)",[6,4]);
  w.plate.classList.add("lock");
  if(missed.length){ SND.reveal(); say("bad","Missed — "+missed.map(m=>m.label).join("; ")+"."); }
  // linger when a found graft is blinking, so the beat has time to land —
  // Skip ahead is there for anyone who would rather not watch it
  // a mouth cycle is ~1.9s against a blink's 0.3s, so it needs longer to land
  const anim=w.anomalies.find(a=>a.found&&(a.blinking||a.glancing));
  const wait = missed.length ? 2000
             : anim ? (anim.kind==="mouth" ? 3400 : 2800)
             : 900;
  setTimeout(()=>{ for(const a of w.anomalies) stopBlinking(a); nextRound(); }, wait);
}
function ringMark(canvas,box,colour,dash){
  const g=canvas.getContext("2d");
  const [x,y,w,h]=box, pad=8;
  g.save();
  g.strokeStyle=colour; g.lineWidth=2;
  if(dash) g.setLineDash(dash);
  g.strokeRect(x-pad,y-pad,w+pad*2,h+pad*2);
  g.restore();
}
function say(cls,msg){ $("#say").className="say "+(cls||""); $("#say").textContent=msg; }

/* Pause freezes the clock and the animations, and the CSS blurs the canvas out
   — without that, pause is simply an unlimited timer. */
function setPaused(p){
  if(!STATE||STATE.over||STATE.roundOver) return;
  STATE.paused=p;
  const w=STATE.works[STATE.rounds[STATE.idx].work];
  if(p){
    STATE.remaining=Math.max(0,STATE.endAt-performance.now());
    clearInterval(TICK); TICK=null;
    for(const a of w.anomalies) stopBlinking(a);
    $("#gal").classList.add("paused");
    $("#pause").textContent="Resume";
    $("#skip").disabled=true;
    say("","Paused.");
  }else{
    STATE.endAt=performance.now()+(STATE.remaining||ROUND_MS);
    $("#gal").classList.remove("paused");
    $("#pause").textContent="Pause";
    $("#skip").disabled=false;
    // restart whatever was animating before the pause
    for(const a of w.anomalies){
      if(a.op==="glance"){ startGlancing(w,a); continue; }   // animates found or not
      if(!a.found||a.op!=="graft") continue;
      if(a.kind==="mouth") startMouthing(w,a); else startBlinking(w,a);
    }
    say("","Look closely. Click anything that is wrong.");
    TICK=setInterval(tick,100); tick();
  }
}

function tick(){
  if(!STATE||STATE.over||STATE.roundOver||STATE.paused) return;
  const left=Math.max(0,STATE.endAt-performance.now());
  const s=Math.ceil(left/1000);
  const cl=$("#clock");
  cl.textContent=String(s).padStart(2,"0");
  cl.className="clock"+(s<=5?" crit":s<=10?" warn":"");
  if(s<=5&&s>0&&s!==STATE.lastTick){ STATE.lastTick=s; SND.tick(); }
  const bar=$("#bar");
  bar.style.width=(left/ROUND_MS*100)+"%";
  bar.className="bar"+(s<=5?" crit":"");
  if(left<=0) endRound(false);
}

function finish(){
  STATE.over=true; clearInterval(TICK);
  stopAllBlinking();
  $("#skip").disabled=true;
  const all=STATE.found===STATE.total;
  const rows=STATE.rounds.map(r=>{
    const w=STATE.works[r.work];
    const got=w.anomalies.filter(a=>a.found).length;
    const n=w.anomalies.length;
    return `<div class="rrow"><span>${esc(w.spec.n)}</span>
            <b class="${got===n?"ok":"no"}">${got}/${n}</b></div>`;
  }).join("");
  $("#card").innerHTML=`
    <h2>${all?"All found":"Gallery closed"}</h2>
    <p class="score${all?"":" bad"}">${STATE.found} / ${STATE.total}</p>
    <div class="rrows">${rows}</div>
    <button id="go2">New gallery</button>`;
  $("#veil").classList.add("on");
  $("#go2").onclick=()=>build().catch(e=>fail(e.message));
}
function fail(msg){
  clearInterval(TICK);
  $("#gal").innerHTML=`<div class="boot" style="color:#b8352c">${esc(msg)}</div>`;
  $("#again").disabled=false;
}

$("#again").addEventListener("click",()=>build().catch(e=>fail(e.message)));
$("#skip").addEventListener("click",()=>endRound(false));
$("#pause").addEventListener("click",()=>setPaused(!STATE||!STATE.paused));
document.addEventListener("keydown",e=>{
  if(e.key===" "&&STATE&&!STATE.over&&!STATE.roundOver){ e.preventDefault(); setPaused(!STATE.paused); }
});
/* Browsers refuse to start audio before a gesture, so the drone begins on the
   first click anywhere rather than on load. */
document.addEventListener("pointerdown",()=>{ if(!SND.isMuted()) SND.startBgm(); },{once:true});
$("#sound").addEventListener("click",()=>{
  const m=!SND.isMuted();
  SND.setMuted(m);
  $("#sound").textContent="Sound: "+(m?"off":"on");
  if(!m) SND.startBgm();
});
build().catch(e=>fail(e.message));
</script>
</body>
</html>
